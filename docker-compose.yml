services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # All game data (synced from Ambr/Gazette, plus admin edits) and reminders live
      # in this one SQLite database — must persist across container recreates. It's
      # populated by running the sync jobs manually (not on every startup), e.g.:
      #   docker compose run --rm bot node dist/scripts/sync.js
      #   docker compose run --rm bot node dist/scripts/sync-gazette.js
      #   docker compose run --rm bot node dist/scripts/deploy-commands.js
      - db:/app/data/db

volumes:
  db:
